name: Publish VanoNote stable1

on:
  push:
    paths:
      - '.github/workflows/publish-stable1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final local build changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          py = Path('vanonote.py')
          text = py.read_text(encoding='utf-8')
          text = re.sub(r'APP_VERSION\s*=\s*"[^"]+"', 'APP_VERSION = "2026.09.09-stable1"', text, count=1)
          text = re.sub(r'fitz\.Matrix\(\s*1\.6\s*,\s*1\.6\s*\)', 'fitz.Matrix(2.2, 2.2)', text, count=1)
          py.write_text(text, encoding='utf-8')

          html = Path('index.html')
          text = html.read_text(encoding='utf-8')
          text = text.replace('width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no', 'width=device-width,initial-scale=1')
          text = text.replace('/assets/app.css?v=1.0.0', '/assets/app.css?v=20260909-stable1')
          text = text.replace('/assets/app.js?v=1.0.0', '/assets/app.js?v=20260909-stable1')
          html.write_text(text, encoding='utf-8')

          js = Path('assets/app.js')
          text = js.read_text(encoding='utf-8')

          def replace_function(source: str, name: str, replacement: str) -> str:
              marker = f'function {name}('
              start = source.find(marker)
              if start < 0:
                  raise RuntimeError(f'Could not find JavaScript function: {name}')
              brace = source.find('{', start)
              if brace < 0:
                  raise RuntimeError(f'Could not parse JavaScript function: {name}')
              depth = 0
              quote = None
              escaped = False
              i = brace
              while i < len(source):
                  ch = source[i]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ("'", '"', '`'):
                      quote = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return source[:start] + replacement + source[i + 1:]
                  i += 1
              raise RuntimeError(f'Unclosed JavaScript function: {name}')

          anchor = 'let overlayRAF=0,safariGestureStartZoom=null;'
          retina = 'const RETINA_DPR=clamp(window.devicePixelRatio||1,1,1.5);'
          if 'const RETINA_DPR=' in text:
              text = re.sub(r'const RETINA_DPR\s*=\s*[^;]+;', retina, text, count=1)
          elif anchor in text:
              text = text.replace(anchor, anchor + '\n' + retina, 1)
          else:
              raise RuntimeError('Retina rendering anchor not found')

          text = replace_function(text, 'setPage', '''function setPage(i,save=true){
            if(!NOTE)return;
            i=clamp(i,0,NOTE.content.pages.length-1);PAGE=i;NOTE.content.activePage=i;
            const p=page(),dpr=RETINA_DPR;
            canvas.width=Math.round(p.width*dpr);canvas.height=Math.round(p.height*dpr);
            overlay.width=Math.round(p.width*dpr);overlay.height=Math.round(p.height*dpr);
            stage.style.width=(p.width*ZOOM)+'px';stage.style.height=(p.height*ZOOM)+'px';
            renderCurrent();renderPages();
            $('#pageStatus').textContent=`Page ${i+1} / ${NOTE.content.pages.length}`;
            $('#classPage').textContent=`${i+1} / ${NOTE.content.pages.length}`;
            if(save)scheduleSave();
          }''')

          text = replace_function(text, 'renderPages', '''function renderPages(){
            if(!NOTE)return;
            const tdpr=RETINA_DPR,tw=Math.round(90*tdpr),th=Math.round(120*tdpr);
            $('#pageThumbs').innerHTML=NOTE.content.pages.map((p,i)=>`<div class="thumb ${i===PAGE?'on':''}" data-i="${i}"><canvas class="thumbCanvas" width="${tw}" height="${th}"></canvas><span>${i+1}</span></div>`).join('');
            $$('.thumb').forEach(thEl=>{
              thEl.onclick=()=>setPage(+thEl.dataset.i);
              const tc=thEl.querySelector('canvas'),tctx=tc.getContext('2d');
              drawPageTo(tctx,NOTE.content.pages[+thEl.dataset.i],tw,th,true);
            });
          }''')

          text = replace_function(text, 'renderCurrent', '''function renderCurrent(){
            const p=page();if(!p)return;
            drawPageTo(ctx,p,canvas.width,canvas.height,false);
            drawOverlay();
          }''')

          text = replace_function(text, 'drawOverlay', '''function drawOverlay(){
            const dpr=RETINA_DPR;
            octx.save();octx.setTransform(1,0,0,1,0,0);
            octx.clearRect(0,0,overlay.width,overlay.height);octx.restore();
            octx.save();octx.setTransform(dpr,0,0,dpr,0,0);
            if(activeStroke)drawStroke(octx,activeStroke);
            if(draftShape)drawShape(octx,draftShape);
            if(laserStroke){
              const s={...laserStroke,color:'#ff3434',size:10,tool:'pen'};
              octx.save();octx.shadowColor='#ff3434';octx.shadowBlur=18;
              drawStroke(octx,s);octx.restore();
            }
            if(selection){
              octx.save();octx.setLineDash([12,8]);octx.strokeStyle='#4d7dff';
              octx.lineWidth=2;octx.fillStyle='rgba(77,125,255,.08)';
              octx.fillRect(selection.x,selection.y,selection.w,selection.h);
              octx.strokeRect(selection.x,selection.y,selection.w,selection.h);
              octx.restore();
            }
            octx.restore();
          }''')
          js.write_text(text, encoding='utf-8')
          PY

          cat > install_vanonote_retina_app.command <<'SH'
          #!/bin/bash
          set -euo pipefail

          DIR="$(cd "$(dirname "$0")" && pwd)"
          APP="$HOME/Applications/VanoNote.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RES="$CONTENTS/Resources"
          PY="$DIR/.venv/bin/python3"

          fail(){ echo ""; echo "ERROR: $1"; exit 1; }
          [ "$(uname -s)" = "Darwin" ] || fail "VanoNote.app installation is available on macOS only."
          command -v python3 >/dev/null 2>&1 || fail "Python 3 is required."

          if [ ! -x "$PY" ]; then
            "$DIR/install_dependencies.command"
          fi
          if ! "$PY" -c 'import webview, fitz' >/dev/null 2>&1; then
            "$DIR/install_dependencies.command"
          fi

          mkdir -p "$HOME/Applications"
          rm -rf "$APP"
          mkdir -p "$MACOS" "$RES"

          printf -v QDIR '%q' "$DIR"
          cat > "$MACOS/VanoNote" <<EOF
          #!/bin/bash
          SOURCE_DIR=$QDIR
          PY="\$SOURCE_DIR/.venv/bin/python3"
          [ -x "\$PY" ] || { osascript -e 'display alert "VanoNote" message "Python environment missing. Run install_dependencies.command in the VanoNote folder." as critical'; exit 1; }
          cd "\$SOURCE_DIR" || exit 1
          exec "\$PY" "\$SOURCE_DIR/desktop.py"
          EOF
          chmod +x "$MACOS/VanoNote"

          cat > "$CONTENTS/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>VanoNote</string>
            <key>CFBundleExecutable</key><string>VanoNote</string>
            <key>CFBundleIdentifier</key><string>com.vanovamaths.vanonote</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>VanoNote</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.1.1</string>
            <key>CFBundleVersion</key><string>1.1.1</string>
            <key>CFBundleIconFile</key><string>VanoNote</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>VanoNote uses the microphone only when you start an audio recording.</string>
            <key>NSSpeechRecognitionUsageDescription</key><string>VanoNote uses speech recognition only when you enable transcription.</string>
            <key>NSAppTransportSecurity</key><dict><key>NSAllowsLocalNetworking</key><true/></dict>
          </dict></plist>
          EOF

          ICON_PNG="$RES/VanoNote-1024.png"
          "$PY" - "$ICON_PNG" <<'PY'
          import math, struct, sys, zlib
          n=1024; scale=n/256; r=58*scale
          bg1=(31,78,55); bg2=(107,141,100); cream=(255,248,232,255); gold=(231,184,92,255)
          poly=[(61,61),(97,61),(128,153),(159,61),(195,61),(145,200),(110,200)]
          poly=[(x*scale,y*scale) for x,y in poly]
          def inside_round(x,y):
              if r<=x<n-r or r<=y<n-r: return True
              cx=r if x<r else n-r-1; cy=r if y<r else n-r-1
              return (x-cx)**2+(y-cy)**2<=r*r
          def inside_poly(x,y):
              c=False; j=len(poly)-1
              for i,(xi,yi) in enumerate(poly):
                  xj,yj=poly[j]
                  if ((yi>y)!=(yj>y)) and x < (xj-xi)*(y-yi)/(yj-yi+1e-12)+xi: c=not c
                  j=i
              return c
          ax,ay=169*scale,153*scale; bx,by=204*scale,188*scale; lw=8*scale
          def on_gold(x,y):
              vx,vy=bx-ax,by-ay; wx,wy=x-ax,y-ay; vv=vx*vx+vy*vy
              t=max(0,min(1,(wx*vx+wy*vy)/vv)); px,py=ax+t*vx,ay+t*vy
              return (x-px)**2+(y-py)**2<=lw*lw
          raw=bytearray()
          for y in range(n):
              raw.append(0)
              for x in range(n):
                  if not inside_round(x,y): raw += bytes((0,0,0,0)); continue
                  t=(x+y)/(2*(n-1)); rgb=tuple(round(bg1[k]*(1-t)+bg2[k]*t) for k in range(3)); px=(*rgb,255)
                  if inside_poly(x+.5,y+.5): px=cream
                  if on_gold(x+.5,y+.5): px=gold
                  raw += bytes(px)
          def chunk(tag,data): return struct.pack('>I',len(data))+tag+data+struct.pack('>I',zlib.crc32(tag+data)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',n,n,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
          open(sys.argv[1],'wb').write(png)
          PY

          TMP="$(mktemp -d)"; ICONSET="$TMP/VanoNote.iconset"; mkdir -p "$ICONSET"
          sips -z 16 16 "$ICON_PNG" --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 "$ICON_PNG" --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$ICON_PNG" --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 "$ICON_PNG" --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$ICON_PNG" --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 "$ICON_PNG" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$ICON_PNG" --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 "$ICON_PNG" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$ICON_PNG" --out "$ICONSET/icon_512x512.png" >/dev/null
          cp "$ICON_PNG" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$RES/VanoNote.icns"
          rm -rf "$TMP"

          codesign --force --deep --sign - "$APP" >/dev/null 2>&1 || true
          touch "$APP"
          echo "VanoNote Retina app installed: $APP"
          echo "Your notes remain in: $DIR/data/vanonote.db"
          open "$APP"
          SH
          chmod +x install_vanonote_retina_app.command

          python3 <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text(encoding='utf-8')
          badge='> **Latest published local build:** `2026.09.09-stable1` — Retina/HiDPI canvas rendering, 2.2× PDF rendering, Mac trackpad gestures, XP-Pen smoothing/pressure, and a native `VanoNote.app` installer with the VanoNote icon.\n\n'
          if 'Latest published local build' not in s:
              pos=s.find('\n\n', s.find('\n')+1)
              s=s[:pos+2]+badge+s[pos+2:]
          old='''./install_dependencies.command\n./install_macos_app.command'''
          new='''./install_dependencies.command\n./install_vanonote_retina_app.command'''
          s=s.replace(old,new,1)
          s=s.replace('├── install_macos_app.command\n', '├── install_macos_app.command\n├── install_vanonote_retina_app.command\n',1)
          if '## Visual showcase' not in s:
              marker='\n## Development\n'
              section='''\n## Visual showcase\n\nA static presentation page lives in `docs/index.html`. Screenshots can be added under `docs/screenshots/` and embedded in both the showcase and this README.\n\n'''
              s=s.replace(marker, section+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate published source
        shell: bash
        run: |
          python3 -m py_compile vanonote.py desktop.py
          node --check assets/app.js
          bash -n install_macos_app.command
          bash -n install_vanonote_retina_app.command

      - name: Commit final stable build
        shell: bash
        run: |
          git config user.name "VanoNote Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add vanonote.py index.html assets/app.js install_vanonote_retina_app.command README.md
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Publish VanoNote 2026.09.09 stable Retina build"
          git push origin HEAD:main
